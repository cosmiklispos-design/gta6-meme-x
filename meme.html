<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>GTA 6 waiting meme</title>
<style>html,body{margin:0;padding:0;width:1024px;height:1024px;background:#1a0b2e;overflow:hidden}</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.45" stop-color="#7597de" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff2d78"/>
      <stop offset="0.75" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12082b"/>
      <stop offset="1" stop-color="#3b0f54"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241040"/>
      <stop offset="1" stop-color="#12081f"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1024" height="880" fill="url(#sky)"/>

  <!-- retro sun -->
  <circle cx="512" cy="430" r="150" fill="#ffe9a8"/>
  <rect x="350" y="440" width="324" height="14" fill="#ff7a3d"/>
  <rect x="350" y="470" width="324" height="18" fill="#ff5e62"/>
  <rect x="350" y="505" width="324" height="24" fill="#ff2d78"/>

  <!-- skyline -->
  <g fill="#1c0b33">
    <rect x="0" y="560" width="90" height="320"/>
    <rect x="95" y="610" width="70" height="270"/>
    <rect x="170" y="540" width="80" height="340"/>
    <rect x="255" y="600" width="60" height="280"/>
    <rect x="700" y="580" width="80" height="300"/>
    <rect x="785" y="530" width="70" height="350"/>
    <rect x="860" y="600" width="70" height="280"/>
    <rect x="935" y="555" width="89" height="325"/>
  </g>
  <g fill="#ffd76a">
    <rect x="20" y="590" width="10" height="12"/><rect x="50" y="630" width="10" height="12"/>
    <rect x="115" y="640" width="10" height="12"/><rect x="190" y="570" width="10" height="12"/>
    <rect x="220" y="620" width="10" height="12"/><rect x="720" y="610" width="10" height="12"/>
    <rect x="800" y="560" width="10" height="12"/><rect x="880" y="630" width="10" height="12"/>
    <rect x="960" y="590" width="10" height="12"/>
  </g>

  <!-- palm trees -->
  <g fill="#160a28">
    <path d="M70 880 Q60 700 95 620 Q100 700 105 880 Z"/>
    <path d="M95 620 Q40 590 10 620 Q50 610 95 630 Q140 600 175 615 Q130 625 95 640 Z"/>
    <path d="M954 880 Q964 700 929 620 Q924 700 919 880 Z"/>
    <path d="M929 620 Q984 590 1014 620 Q974 610 929 630 Q884 600 849 615 Q894 625 929 640 Z"/>
  </g>

  <!-- floor -->
  <rect x="0" y="880" width="1024" height="144" fill="url(#floor)"/>
  <ellipse cx="512" cy="900" rx="420" ry="26" fill="#ff2d78" opacity="0.25"/>

  <!-- TITLE -->
  <text x="512" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ffffff" stroke="#000000" stroke-width="10" paint-order="stroke">WAITING FOR GTA 6</text>
  <text x="512" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ffe9a8" stroke="#000000" stroke-width="10" paint-order="stroke">SINCE 2013</text>

  <!-- TV on the left -->
  <g>
    <rect x="52" y="470" width="280" height="200" rx="10" fill="#0d0518" stroke="#000" stroke-width="4"/>
    <rect x="66" y="484" width="252" height="150" rx="6" fill="url(#screen)"/>
    <text x="192" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ff2d78" stroke="#ff9ecf" stroke-width="1">GTA VI</text>
    <text x="192" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#ffffff">MAY 2026*</text>
    <text x="192" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c9b8e8">*probably</text>
    <rect x="170" y="670" width="44" height="26" fill="#0d0518"/>
    <rect x="120" y="696" width="144" height="10" rx="5" fill="#0d0518"/>
    <!-- empty pizza boxes -->
    <g>
      <rect x="60" y="716" width="120" height="26" rx="3" fill="#c98f4e" stroke="#8a5a20" stroke-width="2" transform="rotate(-4 120 729)"/>
      <rect x="70" y="748" width="120" height="26" rx="3" fill="#b57a3a" stroke="#8a5a20" stroke-width="2" transform="rotate(3 130 761)"/>
      <circle cx="118" cy="729" r="14" fill="#e8b04b" stroke="#8a5a20" stroke-width="2"/>
    </g>
  </g>

  <!-- couch -->
  <g>
    <rect x="360" y="640" width="400" height="180" rx="26" fill="#3d2b63" stroke="#241640" stroke-width="4"/>
    <rect x="360" y="640" width="400" height="70" rx="26" fill="#4a3577"/>
    <rect x="352" y="700" width="34" height="120" rx="14" fill="#4a3577" stroke="#241640" stroke-width="3"/>
    <rect x="734" y="700" width="34" height="120" rx="14" fill="#4a3577" stroke="#241640" stroke-width="3"/>
    <rect x="386" y="760" width="180" height="60" rx="12" fill="#55418a"/>
    <rect x="578" y="760" width="180" height="60" rx="12" fill="#55418a"/>
  </g>

  <!-- skeleton on the couch -->
  <g stroke="#f2ead8" stroke-width="10" stroke-linecap="round" fill="#f2ead8">
    <!-- legs -->
    <line x1="500" y1="790" x2="470" y2="868"/>
    <line x1="610" y1="790" x2="640" y2="868"/>
    <!-- spine -->
    <line x1="555" y1="700" x2="555" y2="790"/>
    <!-- ribs -->
    <path d="M500 716 Q555 700 610 716" fill="none" stroke-width="8"/>
    <path d="M500 740 Q555 724 610 740" fill="none" stroke-width="8"/>
    <path d="M505 764 Q555 748 605 764" fill="none" stroke-width="8"/>
    <!-- arms to controller -->
    <line x1="500" y1="720" x2="520" y2="800"/>
    <line x1="610" y1="720" x2="590" y2="800"/>
    <!-- skull -->
    <ellipse cx="555" cy="668" rx="46" ry="42"/>
    <rect x="525" y="690" width="60" height="26" rx="8"/>
    <!-- eye sockets, nose, teeth -->
    <circle cx="537" cy="662" r="11" fill="#160a28" stroke="none"/>
    <circle cx="573" cy="662" r="11" fill="#160a28" stroke="none"/>
    <path d="M555 678 L548 692 L562 692 Z" fill="#160a28" stroke="none"/>
    <line x1="540" y1="694" x2="540" y2="712" stroke="#160a28" stroke-width="3"/>
    <line x1="555" y1="694" x2="555" y2="712" stroke="#160a28" stroke-width="3"/>
    <line x1="570" y1="694" x2="570" y2="712" stroke="#160a28" stroke-width="3"/>
    <!-- controller -->
    <rect x="512" y="792" width="86" height="34" rx="12" fill="#22222e" stroke="#000" stroke-width="3"/>
    <circle cx="530" cy="809" r="6" fill="#ff2d78"/>
    <circle cx="580" cy="809" r="6" fill="#37c8ff"/>
  </g>
  <!-- cobweb on the skull -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.75" fill="none">
    <path d="M520 632 L500 600 M520 632 L540 598 M520 632 L560 606"/>
    <path d="M508 612 Q524 620 540 610 M516 622 Q530 628 548 618"/>
  </g>

  <!-- make.fun ghost, floating right -->
  <g transform="translate(-80 0)">
  <g transform="rotate(8 850 480)">
    <path d="M800 560 C800 470 830 420 880 420 C930 420 960 470 960 560 L960 640 L938 622 L918 642 L896 622 L876 642 L856 622 L836 642 L816 622 L800 642 Z"
      fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <!-- sparkle eyes -->
    <path d="M848 505 L854 520 L869 526 L854 532 L848 547 L842 532 L827 526 L842 520 Z" fill="#000"/>
    <path d="M908 505 L914 520 L929 526 L914 532 L908 547 L902 532 L887 526 L902 520 Z" fill="#000"/>
    <!-- little round hand holding the coin -->
    <circle cx="968" cy="585" r="16" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <circle cx="1000" cy="585" r="34" fill="#ff2d78" stroke="#000000" stroke-width="6"/>
    <path d="M1000 562 L1006 578 L1022 578 L1009 588 L1014 604 L1000 594 L986 604 L991 588 L978 578 L994 578 Z" fill="#ffffff"/>
  </g>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="470" y="216" width="500" height="150" rx="24" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <path d="M770 366 L800 422 L830 366 Z" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <text x="720" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">my agent already made $500</text>
    <text x="720" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">on make.fun while</text>
    <text x="720" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">we waited!</text>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="880" width="1024" height="144" fill="#ff2d78"/>
  <text x="512" y="946" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#ffffff">make.fun</text>
  <text x="512" y="992" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">where AI agents earn real money</text>
</svg>
</body>
</html>
